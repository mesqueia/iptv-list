name: Update Gerard Romero YouTube live

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/youtube-live.yml"
      - "scripts/update_youtube_live.py"

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh YouTube live URL
        run: python scripts/update_youtube_live.py

      - name: Commit playlist if changed
        run: |
          if git diff --quiet -- cat-spa.m3u; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cat-spa.m3u
          git commit -m "Refresh Gerard Romero live stream"
          git push
